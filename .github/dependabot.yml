version: 2
updates:
  # Un seul bloc pour le dépôt et les workflows gérés : `group-by: dependency-name` ouvre une PR
  # par action, qui la monte dans les deux dossiers à la fois. Une PR par dossier échouerait, car
  # la CI du dépôt modèle doit suivre le socle étape pour étape.
  - package-ecosystem: github-actions
    directories:
      - /
      - /template/.github/workflows
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
    groups:
      actions:
        group-by: dependency-name
  # L'image de la fausse app (job fausse-app de la CI), épinglée par empreinte.
  - package-ecosystem: docker
    directory: /tests/modele/fausse-app
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
    # Une majeure d'image de base est une décision, pas une mise à jour de routine.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
