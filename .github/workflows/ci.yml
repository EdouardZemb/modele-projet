name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ${{ matrix.os }}
    # 25 min : sous Windows, la suite a dépassé 15 min au lot 9 (LE-29).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Installer sops et age
        shell: bash
        run: |
          set -euo pipefail
          # sops 3.13.3 : sommes de sops-v3.13.3.checksums.txt, dans la release de sops.
          # age 1.3.2 : pas de fichier de sommes ; sommes = champ « digest » de l'API des releases
          #   (gh api repos/FiloSottile/age/releases/tags/v1.3.2).
          SOPS_BASE=https://github.com/getsops/sops/releases/download/v3.13.3
          AGE_BASE=https://github.com/FiloSottile/age/releases/download/v1.3.2
          # Téléchargement et extraction à part : « age » est à la fois le dossier de l'archive et un binaire.
          telechargement="$RUNNER_TEMP/outils-telechargement"
          dossier="$RUNNER_TEMP/outils/bin"
          mkdir -p "$telechargement" "$dossier"
          cd "$telechargement"
          if [ "$RUNNER_OS" = Windows ]; then
            curl -fsSL -o sops.exe "$SOPS_BASE/sops-v3.13.3.amd64.exe"
            curl -fsSL -o age.zip "$AGE_BASE/age-v1.3.2-windows-amd64.zip"
            cat > sommes.txt <<'SOMMES'
          a4a9a398858fe8b2ef72d9686d930bf7c5cece9be74ad83ac3b53cfdd70e6b1c  sops.exe
          f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7  age.zip
          SOMMES
            sha256sum -c sommes.txt
            python -m zipfile -e age.zip extrait
            cp sops.exe extrait/age/age.exe extrait/age/age-keygen.exe "$dossier"
            chemin_path="$(cygpath -w "$dossier")"
            # bash est celui de Git : test_ci_serveur.py y lance les étapes de CI comme GitHub.
            sans_saut=sops,age,age-keygen,powershell,bash
          else
            curl -fsSL -o sops "$SOPS_BASE/sops-v3.13.3.linux.amd64"
            curl -fsSL -o age.tar.gz "$AGE_BASE/age-v1.3.2-linux-amd64.tar.gz"
            cat > sommes.txt <<'SOMMES'
          e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  sops
          cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  age.tar.gz
          SOMMES
            sha256sum -c sommes.txt
            mkdir extrait
            tar -xzf age.tar.gz -C extrait
            cp sops extrait/age/age extrait/age/age-keygen "$dossier"
            chmod +x "$dossier/sops" "$dossier/age" "$dossier/age-keygen"
            chemin_path="$dossier"
            # Sur ubuntu-latest, shellcheck (test_combinaison_shellcheck) et bash
            # (test_ci_serveur.py) sont préinstallés. Docker n'est pas exigé ici : les tests bats de
            # la mécanique, qui le demandent, tournent dans le job mecanique.
            sans_saut=sops,age,age-keygen,pwsh,shellcheck,bash
          fi
          echo "$chemin_path" >> "$GITHUB_PATH"
          echo "MODELE_TESTS_SANS_SAUT=$sans_saut" >> "$GITHUB_ENV"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # tests/test_mecanique.py tourne dans le job mecanique, et seulement là.
      - run: python -m pytest -q --ignore=tests/test_mecanique.py

  # Les tests bats de la mécanique `serveur` (tests/deploiement/ d'un projet rendu, avec et sans
  # sauvegardes), dans leur image Docker : le seul job qui lance tests/test_mecanique.py. Docker
  # (serveur Linux) est préinstallé sur ubuntu-latest, et rien n'y saute.
  mecanique:
    name: mecanique
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_mecanique.py
        env:
          MODELE_TESTS_SANS_SAUT: "1"

  # La fausse app (tests/modele/fausse-app/) dans un projet `serveur` rendu, par l'action
  # modele-image-construire du rendu, en vrai Docker : construction, santé, révision, sauvegarde,
  # vérification (spec §10.3).
  fausse-app:
    name: fausse-app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # nature=donnees : le mode à un dépôt, qui porte son instance (env/, bloc de ports, domaine),
      # tant que la fausse app ne sert pas la chaîne à deux dépôts (lot 12).
      - name: Rendre le projet fausse-app et y poser la fausse app
        run: |
          copier copy --vcs-ref HEAD --defaults --trust \
            --data nom=fausse-app --data "description=La fausse app du modèle" \
            --data cible=serveur --data nature=donnees --data bloc_ports=4310 \
            --data sauvegardes=true --data domaine=exemple.org . rendu
          cp tests/modele/fausse-app/* rendu/
      - uses: ./rendu/.github/actions/modele-image-construire
        with:
          dossier: rendu
      - name: Épreuve du ménage des images (vrai Docker, registre local)
        run: bash tests/modele/epreuve-menage.sh rendu
      - name: Journal du conteneur
        if: failure()
        run: docker logs fausse-app || true
      - name: Retirer le registre et les conteneurs de l'épreuve
        if: always()
        run: docker rm -f -v epreuve-registre epreuve-conteneur || true
      - name: Supprimer le conteneur
        if: always()
        run: docker rm -f -v fausse-app

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Secrets chiffrés (clés et destinataires, sans déchiffrer)
        run: python template/scripts/modele/verifier_secrets.py

  confidentialite:
    name: confidentialite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Déterminer la base de comparaison
        env:
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BASE_PUSH: ${{ github.event.before }}
        run: echo "BASE=${BASE_PR:-$BASE_PUSH}" >> "$GITHUB_ENV"
      - name: Confidentialité du diff
        env:
          MOTIFS_INTERDITS: ${{ secrets.MOTIFS_INTERDITS }}
          DEPOT_PRIVE: ${{ github.event.repository.private }}
          BRANCHE_DEFAUT: ${{ github.event.repository.default_branch }}
        run: python template/scripts/modele/confidentialite.py --exiger-prives --diff "$BASE"
      - name: Format des commits
        run: |
          case "$BASE" in
            *[!0]*) python template/scripts/modele/commits.py --plage "$BASE..HEAD" ;;
            *) echo "Base nulle : plage de commits non contrôlée." ;;
          esac
      - name: Confidentialité des messages de commit
        env:
          MOTIFS_INTERDITS: ${{ secrets.MOTIFS_INTERDITS }}
          DEPOT_PRIVE: ${{ github.event.repository.private }}
          BRANCHE_DEFAUT: ${{ github.event.repository.default_branch }}
        run: |
          case "$BASE" in
            *[!0]*) git log --format=%B "$BASE..HEAD" > "$RUNNER_TEMP/messages.txt" ;;
            *) git log --format=%B HEAD > "$RUNNER_TEMP/messages.txt" ;;
          esac
          python template/scripts/modele/confidentialite.py --exiger-prives --texte "$RUNNER_TEMP/messages.txt"
      - name: Confidentialité et format du titre et du corps de la PR
        if: github.event_name == 'pull_request'
        env:
          MOTIFS_INTERDITS: ${{ secrets.MOTIFS_INTERDITS }}
          DEPOT_PRIVE: ${{ github.event.repository.private }}
          BRANCHE_DEFAUT: ${{ github.event.repository.default_branch }}
          TITRE: ${{ github.event.pull_request.title }}
          CORPS: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$TITRE" "$CORPS" > "$RUNNER_TEMP/pr.txt"
          python template/scripts/modele/confidentialite.py --exiger-prives --texte "$RUNNER_TEMP/pr.txt"
          python template/scripts/modele/commits.py --titre "$TITRE"
      - name: Le garde de Claude est branché
        run: |
          python - <<'FIN'
          import json
          import re
          import sys

          OUTILS = ("Bash", "PowerShell", "Monitor")


          def couvre(matcher, outil):
              if matcher in (None, "", "*"):
                  return True
              try:
                  return re.fullmatch(matcher, outil) is not None
              except (re.error, TypeError):
                  return False


          try:
              with open(".claude/settings.json", encoding="utf-8") as f:
                  reglages = json.load(f)
              branche = reglages.get("disableAllHooks") is not True and any(
                  all(couvre(groupe.get("matcher"), outil) for outil in OUTILS)
                  and any(
                      "garde_claude.py" in crochet.get("command", "")
                      for crochet in groupe.get("hooks", [])
                  )
                  for groupe in reglages["hooks"]["PreToolUse"]
              )
              signaux = branche and any(
                  couvre(groupe.get("matcher"), "startup")
                  and couvre(groupe.get("matcher"), "resume")
                  and any(
                      "signaux.py" in crochet.get("command", "")
                      for crochet in groupe.get("hooks", [])
                  )
                  for groupe in reglages["hooks"]["SessionStart"]
              )
          except (OSError, ValueError, KeyError, TypeError, AttributeError):
              branche = signaux = False
          if not (branche and signaux):
              print(
                  "garde : .claude/settings.json est illisible (conflit de copier update ?), "
                  "coupe les hooks (disableAllHooks), ou n'a plus de hook PreToolUse qui "
                  "appelle garde_claude.py pour Bash, PowerShell et Monitor, ou n'a plus de hook "
                  "SessionStart (startup et resume) qui appelle signaux.py",
                  file=sys.stderr,
              )
              sys.exit(1)
          FIN
