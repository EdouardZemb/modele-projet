_min_copier_version: "9.19"
_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: .jinja
_skip_if_exists:
  - CLAUDE.md
  - README.md
  - .gitattributes
  - .gitignore
  - .editorconfig
  - docs/00-brief-initial.md
  - docs/cadrage.md
  - docs/decisions/README.md
  - docs/pistes.md
  - docs/registre.md
  - docs/exploitation.md
  - config/README.md
  - contenu/README.md
  - .github/workflows/ci.yml
  - .github/dependabot.yml
  - deploiement/projet.env
  - deploiement/compose.projet.yml
  - deploiement/secrets/prod.cles
  - deploiement/secrets/staging.cles
  # L'instance : semée, un projet à un dépôt garde ses clés, son .sops.yaml et le dépôt de données
  # ses env/ (M-0006, § 9). Les env/ d'un projet à un dépôt restent gérés.
  - .sops.yaml
  - deploiement/cles/serveur.pub
  - deploiement/cles/hors-ligne.pub
  - cles/serveur.pub
  - cles/hors-ligne.pub
  - env/prod.env
  - env/staging.env
nom:
  type: str
  help: Nom du projet, qui est aussi celui du dépôt
  validator: "{% if not (nom | regex_search('^[a-z][a-z0-9-]*$')) %}minuscules, chiffres et tirets, en commençant par une lettre{% endif %}"
description:
  type: str
  help: Le projet en une phrase
  validator: "{% if not description.strip() %}une phrase est requise{% endif %}"
cible:
  type: str
  help: Ce que le modèle rend (aucune, serveur, ou donnees pour un dépôt de données ; le lot 3 ajoutera statique)
  choices: [aucune, serveur, donnees]
  default: aucune
  validator: "{% if cible == 'donnees' and not (nom | regex_search('-donnees$')) %}un dépôt de données se nomme <nom>-donnees{% endif %}"
cible_code:
  type: str
  help: La cible du dépôt de code dont ce dépôt porte les données ; serveur, il porte aussi l'instance (env/, .sops.yaml, les clés du parc)
  choices: [aucune, serveur]
  default: aucune
  when: "{{ cible == 'donnees' }}"
nature:
  type: str
  help: code pour tout projet né après M-0006 ; donnees pour un dépôt de données, ou un dépôt d'avant M-0006 jusqu'à sa scission
  choices: {code: code, données: donnees}
  default: "{{ 'donnees' if cible == 'donnees' or ((visibilite | default('')) == 'prive' and 'visibilite' not in _copier_conf.data) else 'code' }}"
  when: "{{ cible != 'donnees' }}"
branche_principale:
  type: str
  help: Branche par défaut du dépôt
  default: main
  validator: "{% if not (branche_principale | regex_search('^[a-z][a-z0-9/-]*$')) %}nom de branche invalide{% endif %}"
fusion:
  type: str
  help: Qui fusionne les PR une fois tous les contrôles verts
  choices: {la session fusionne quand tout est vert: session, Edouard fusionne: edouard}
  default: session
compte:
  type: str
  help: Compte GitHub qui porte le dépôt et les images du projet
  default: EdouardZemb
  validator: "{% if not (compte | regex_search('^[A-Za-z0-9](-?[A-Za-z0-9])*$')) %}un compte GitHub{% endif %}"
# L'instance (le domaine, le sous-domaine, le bloc de ports, les clés du parc) n'est posée que là où
# elle vit : un projet `serveur` à un dépôt, de nature donnees, ou le dépôt de données d'un projet
# `serveur`. Un dépôt de code rend ses tests et ses scripts avec des valeurs d'exemple, qui n'entrent
# pas dans ses réponses ; ses scripts lisent les vraies dans env/ (M-0006, § 4).
porte_instance:
  type: bool
  default: "{{ (cible == 'serveur' and nature == 'donnees') or (cible == 'donnees' and cible_code == 'serveur') }}"
  when: false
domaine:
  type: str
  help: Domaine public sous lequel le projet est servi
  # Demandé, il n'a pas de défaut : un projet qui porte son instance ne naît pas sur l'exemple.
  default: "{{ UNSET if porte_instance else 'exemple.org' }}"
  when: "{{ porte_instance }}"
  validator: "{% if not (domaine | regex_search('^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$')) %}un nom de domaine en minuscules{% endif %}"
sous_domaine:
  type: str
  help: Sous-domaine du projet (la préproduction ajoute -staging)
  default: "{{ nom[:-8] if cible == 'donnees' else nom }}"
  when: "{{ porte_instance }}"
  validator: "{% if not (sous_domaine | regex_search('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$')) %}sous-domaine non vide, en minuscules, chiffres et tirets{% endif %}"
port_app:
  type: int
  help: Port d'écoute de l'application dans son conteneur
  default: 3000
  when: "{{ cible == 'serveur' }}"
  validator: "{% if port_app < 1 or port_app > 65535 %}port de 1 à 65535{% endif %}"
chemin_sante:
  type: str
  help: Chemin HTTP de la sonde de santé de l'application
  default: /api/sante
  when: "{{ cible == 'serveur' }}"
  validator: "{% if not (chemin_sante | regex_search('^/[A-Za-z0-9/_.-]*$')) %}le chemin commence par / et ne contient que lettres, chiffres, /, _, . et -{% endif %}"
bloc_ports:
  type: int
  help: Premier port du bloc de dix réservé au projet sur le serveur (multiple de 10, de 4310 à 4990)
  default: "{{ UNSET if porte_instance else 4310 }}"
  when: "{{ porte_instance }}"
  validator: "{% if bloc_ports % 10 != 0 or bloc_ports < 4310 or bloc_ports > 4990 %}bloc de ports : multiple de 10, de 4310 à 4990{% endif %}"
sauvegardes:
  type: bool
  help: Le projet a-t-il des données à sauvegarder ?
  default: true
  when: "{{ cible == 'serveur' }}"
# Les clés publiques age du parc, destinataires des secrets. Exigées d'un dépôt de données ; vides,
# un projet à un dépôt garde ses deploiement/cles/*.pub et son .sops.yaml, semés.
cle_serveur:
  type: str
  help: Clé publique age du serveur (age1…), qui déchiffre les secrets au déploiement
  default: ""
  when: "{{ porte_instance }}"
  validator: "{% if (cle_serveur or cible == 'donnees') and not (cle_serveur | regex_search('^age1[0-9a-z]{58}$')) %}une clé publique age (age1 et 58 caractères){% if cible == 'donnees' %}, exigée pour un dépôt de données{% else %}, ou rien pour garder la sienne{% endif %}{% endif %}"
cle_hors_ligne:
  type: str
  help: Clé publique age hors ligne du propriétaire (age1…), qui relit les secrets et les sauvegardes si le serveur est perdu
  default: ""
  when: "{{ porte_instance }}"
  validator: "{% if (cle_hors_ligne or cible == 'donnees') and not (cle_hors_ligne | regex_search('^age1[0-9a-z]{58}$')) %}une clé publique age (age1 et 58 caractères){% if cible == 'donnees' %}, exigée pour un dépôt de données{% else %}, ou rien pour garder la sienne{% endif %}{% endif %}"
# Le préfixe des variables : celui du projet, dans son dépôt de code comme dans ses données.
prefixe:
  type: str
  default: "{{ ((nom[:-8]) if cible == 'donnees' else nom) | upper | replace('-', '_') }}_"
  when: false
