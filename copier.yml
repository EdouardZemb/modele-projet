_min_copier_version: "9.19"
_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: .jinja
_skip_if_exists:
  - CLAUDE.md
  - README.md
  - .gitattributes
  - .gitignore
  - .editorconfig
  - docs/00-brief-initial.md
  - docs/cadrage.md
  - docs/decisions/README.md
  - docs/pistes.md
  - docs/registre.md
  - docs/exploitation.md
  - config/README.md
  - contenu/README.md
  - .github/workflows/ci.yml
  - .github/dependabot.yml
  - deploiement/projet.env
  - deploiement/compose.projet.yml
  - deploiement/secrets/prod.cles
  - deploiement/secrets/staging.cles
nom:
  type: str
  help: Nom du projet, qui est aussi celui du dépôt
  validator: "{% if not (nom | regex_search('^[a-z][a-z0-9-]*$')) %}minuscules, chiffres et tirets, en commençant par une lettre{% endif %}"
description:
  type: str
  help: Le projet en une phrase
  validator: "{% if not description.strip() %}une phrase est requise{% endif %}"
cible:
  type: str
  help: Ce que le modèle rend (aucune, serveur, ou donnees pour un dépôt de données ; le lot 3 ajoutera statique)
  choices: [aucune, serveur, donnees]
  default: aucune
  validator: "{% if cible == 'donnees' and not (nom | regex_search('-donnees$')) %}un dépôt de données se nomme <nom>-donnees{% endif %}"
nature:
  type: str
  help: Ce que le dépôt porte, du code seul ou aussi des données
  choices: {code: code, données: donnees}
  default: "{{ 'donnees' if cible == 'donnees' or (visibilite | default('')) == 'prive' else 'code' }}"
  when: "{{ cible != 'donnees' }}"
branche_principale:
  type: str
  help: Branche par défaut du dépôt
  default: main
  validator: "{% if not (branche_principale | regex_search('^[a-z][a-z0-9/-]*$')) %}nom de branche invalide{% endif %}"
fusion:
  type: str
  help: Qui fusionne les PR une fois tous les contrôles verts
  choices: {la session fusionne quand tout est vert: session, Edouard fusionne: edouard}
  default: session
domaine:
  type: str
  help: Domaine public sous lequel le projet est servi
  when: "{{ cible == 'serveur' }}"
  validator: "{% if not (domaine | regex_search('^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$')) %}un nom de domaine en minuscules{% endif %}"
sous_domaine:
  type: str
  help: Sous-domaine du projet (la préproduction ajoute -staging)
  default: "{{ nom }}"
  when: "{{ cible == 'serveur' }}"
  validator: "{% if not (sous_domaine | regex_search('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$')) %}sous-domaine non vide, en minuscules, chiffres et tirets{% endif %}"
port_app:
  type: int
  help: Port d'écoute de l'application dans son conteneur
  default: 3000
  when: "{{ cible == 'serveur' }}"
  validator: "{% if port_app < 1 or port_app > 65535 %}port de 1 à 65535{% endif %}"
chemin_sante:
  type: str
  help: Chemin HTTP de la sonde de santé de l'application
  default: /api/sante
  when: "{{ cible == 'serveur' }}"
  validator: "{% if not (chemin_sante | regex_search('^/[A-Za-z0-9/_.-]*$')) %}le chemin commence par / et ne contient que lettres, chiffres, /, _, . et -{% endif %}"
bloc_ports:
  type: int
  help: Premier port du bloc de dix réservé au projet sur le serveur (multiple de 10, de 4310 à 4990)
  when: "{{ cible == 'serveur' }}"
  validator: "{% if bloc_ports % 10 != 0 or bloc_ports < 4310 or bloc_ports > 4990 %}bloc de ports : multiple de 10, de 4310 à 4990{% endif %}"
sauvegardes:
  type: bool
  help: Le projet a-t-il des données à sauvegarder ?
  default: true
  when: "{{ cible == 'serveur' }}"
prefixe:
  type: str
  default: "{{ nom | upper | replace('-', '_') }}_"
  when: false
