# Géré par le modèle — ne pas modifier ici (docs/modele/methode.md).
name: socle

on:
  workflow_call:
    secrets:
      MOTIFS_INTERDITS:
        required: false

permissions:
  contents: read

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  confidentialite:
    name: confidentialite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Déterminer la base de comparaison
        env:
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BASE_PUSH: ${{ github.event.before }}
        run: echo "BASE=${BASE_PR:-$BASE_PUSH}" >> "$GITHUB_ENV"
      - name: Confidentialité du diff
        env:
          MOTIFS_INTERDITS: ${{ secrets.MOTIFS_INTERDITS }}
        run: python scripts/modele/confidentialite.py --exiger-prives --diff "$BASE"
      - name: Format des commits
        run: |
          case "$BASE" in
            *[!0]*) python scripts/modele/commits.py --plage "$BASE..HEAD" ;;
            *) echo "Base nulle : plage de commits non contrôlée." ;;
          esac
      - name: Confidentialité et format du titre et du corps de la PR
        if: github.event_name == 'pull_request'
        env:
          MOTIFS_INTERDITS: ${{ secrets.MOTIFS_INTERDITS }}
          TITRE: ${{ github.event.pull_request.title }}
          CORPS: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$TITRE" "$CORPS" > pr.txt
          python scripts/modele/confidentialite.py --exiger-prives --texte pr.txt
          python scripts/modele/commits.py --titre "$TITRE"
